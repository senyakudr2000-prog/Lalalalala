name: Secret build
on:
  push:
    branches: [ main ]
    paths:
      - 'second/**'
      - '.github/workflows/build-secret.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: second
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: hiddenexperiment-1.21.1
          path: second/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
